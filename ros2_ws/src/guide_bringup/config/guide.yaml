# Parameters for the guide_* nodes. Paths are relative to the directory the
# launch is started from (the repository root) unless absolute.

serial_bridge:
  ros__parameters:
    port: /dev/ttyACM0
    baud: 115200
    rate_hz: 20.0
    # Tank steering: the car turns slower than commanded because the tracks
    # slip. Measure on the floor it drives: ros2 run guide_bridge calibrate_turn
    turn_gain: 1.0
    min_pivot_rate: 0.0   # rad/s: slower pivots stall, so they are raised to this

phone_imu:
  ros__parameters:
    port: 8765
    frame_id: phone_link
    accel_scale: 1.0            # 9.81 if the phone reports in g
    # Android orientation is magnetic-north based. SFU Burnaby declination is
    # about 15.5 deg east (2026); true ENU yaw = magnetic yaw - declination.
    world_yaw_offset: -0.27

velocity_gate:
  ros__parameters:
    outdoor_max: 1.0
    indoor_max: 0.6
    person_stop: 1.0
    person_slow: 3.0
    require_person_detector: true

mission:
  ros__parameters:
    graph: maps/route_graph.json
    start_floor: ""             # "" = outdoors; e.g. AQ-03 when starting indoors
    voice_mode: false

localization_manager:
  ros__parameters:
    maps_dir: maps
    rtabmap_db_dir: rtabmap_db
    alignments: rtabmap_db/alignments.yaml

ui_server:
  ros__parameters:
    maps_dir: maps
    port: 8080
    rosbridge_port: 9090

floor_segmentation:
  ros__parameters:
    model: models/segformer-b0-ade.onnx
    labels: models/segformer-b0-ade.labels.json
    rate_hz: 2.0                 # spec section 15: 2 Hz on CPU

person_detection:
  ros__parameters:
    model: models/yolo11n.onnx    # yolo11n.pt with an NVIDIA GPU
    rate_hz: 10.0

sign_reader:
  ros__parameters:
    backend: paddle              # paddle (local) | claude (your Claude subscription) | claude_api (API key) | gemini (GEMINI_API_KEY)
    gemini_model: gemini-flash-latest
    rate_hz: 1.0                 # 2.0 with a GPU; with backend claude use 0.2 to stay inside subscription limits

vp_heading:
  ros__parameters:
    rate_hz: 10.0
    # Measurements further than this from the current heading are dropped: lines
    # on a patterned floor make false vanishing points, and a wide gate lets them
    # ratchet the heading away (HIL simulation: 20 deg let a 30 deg error in).
    max_disagreement_deg: 12.0

mono_odometry:              # cameras:=mono only (spec section 18)
  ros__parameters:
    rate_hz: 10.0
    min_range: 0.4          # m: the floor band it tracks
    max_range: 4.0

student_tracker:
  ros__parameters:
    model: models/yolo11n.onnx
    rate_hz: 5.0

voice_agent:
  ros__parameters:
    graph: maps/route_graph.json
    whisper_model: base          # small with a GPU
    whisper_device: auto
    whisper_compute: int8
    piper_voice: voices/en_US-lessac-medium.onnx
    llm: claude                  # claude | gemini (GEMINI_API_KEY)
    claude_model: claude-haiku-4-5
    claude_auth: subscription    # your Claude subscription (claude setup-token); or api_key (ANTHROPIC_API_KEY)
    gemini_model: gemini-flash-latest
    # Cloud speech (ELEVENLABS_API_KEY). Each falls back to the local engine on any
    # failure, so the car keeps talking without WiFi. stt: elevenlabs sends the
    # student's voice off the laptop; tts: elevenlabs only the car's sentences.
    tts: piper                   # piper | elevenlabs
    stt: whisper                 # whisper | elevenlabs
    elevenlabs_voice_id: 21m00Tcm4TlvDq8ikWAM
    elevenlabs_tts_model: eleven_flash_v2_5
    elevenlabs_stt_model: scribe_v1

phone_rssi:
  ros__parameters:
    device_name: SFU-GUIDE
