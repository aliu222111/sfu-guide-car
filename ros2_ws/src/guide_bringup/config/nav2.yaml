# Nav2 for the guide car (spec section 8). The car is an RC car with Ackermann
# steering: it cannot turn on the spot. Smac Hybrid-A* plans paths it can drive
# (a minimum turning radius, backing up allowed for three-point turns), and
# Regulated Pure Pursuit follows them. Map comes from map_server, switched per
# floor by the localization manager. Localization is robot_localization
# (map -> odom), no AMCL.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 200      # ms for a server to accept a goal; 20 failed under load in the HIL simulator
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Only NavigateThroughPoses: the mission node sends every leg as a pose list.
    navigators: ["navigate_through_poses"]
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_through_poses_bt_xml is set by navigation.launch.py to
    # guide_bringup/behavior_trees/navigate_through_poses.xml
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0   # the velocity gate holds the car for a student or a bumper reading: not a failure
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5     # waypoints are graph nodes; the door node is "within 2 m" (spec section 1)
      yaw_goal_tolerance: 3.14   # no heading requirement at waypoints
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8          # the velocity gate caps it: 0.6 indoors (spec section 2)
      lookahead_dist: 1.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true    # slow down on tight curves
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.2
      use_cost_regulated_linear_velocity_scaling: true   # and near walls and obstacles
      inflation_cost_scaling_factor: 2.5               # local costmap's
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: false     # Ackermann: never turn on the spot
      allow_reversing: true            # follow the planner's backing-up segments
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.63, 0.205], [0.63, -0.205], [-0.12, -0.205], [-0.12, 0.205]]"  # 75 x 41 cm body; base_link is the rear axle
      plugins: ["voxel_layer", "floor_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.8
        mark_threshold: 0
        observation_sources: stereo
        stereo:
          topic: /stereo/points2
          data_type: "PointCloud2"
          min_obstacle_height: 0.06   # ignore the floor itself (base_link is on the floor)
          max_obstacle_height: 1.8
          marking: True
          clearing: True
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          expected_update_rate: 0.5
      floor_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: floor_obstacles floor_free yolo_objects
        floor_obstacles:              # curbs, grass edges, stair tops, glass bases (spec section 7)
          topic: /floor/obstacles
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          marking: True
          clearing: False
          obstacle_max_range: 5.0
        floor_free:
          topic: /floor/free
          data_type: "PointCloud2"
          min_obstacle_height: -0.1
          max_obstacle_height: 0.05
          marking: False
          clearing: True
          raytrace_max_range: 5.0
        yolo_objects:                 # chairs, benches, bags, bikes... where YOLO sees them touch the floor
          topic: /objects/obstacles
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          marking: True
          clearing: False
          obstacle_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Cost fades gently out to 0.8 m, so the controller keeps off walls and
        # boxes instead of brushing past them at the 0.43 m minimum.
        cost_scaling_factor: 2.5
        inflation_radius: 0.8
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.63, 0.205], [0.63, -0.205], [-0.12, -0.205], [-0.12, 0.205]]"  # 75 x 41 cm body; base_link is the rear axle
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: stereo floor_obstacles floor_free yolo_objects
        stereo:
          topic: /stereo/points2
          data_type: "PointCloud2"
          min_obstacle_height: 0.06
          max_obstacle_height: 1.8
          marking: True
          clearing: True
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
        floor_obstacles:
          topic: /floor/obstacles
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          marking: True
          clearing: False
          obstacle_max_range: 5.0
        floor_free:                   # floor seen clear wipes old floor_obstacles (else false positives pile up)
          topic: /floor/free
          data_type: "PointCloud2"
          min_obstacle_height: -0.1
          max_obstacle_height: 0.05
          marking: False
          clearing: True
          raytrace_max_range: 5.0
        yolo_objects:                 # chairs, benches, bags, bikes... where YOLO sees them touch the floor
          topic: /objects/obstacles
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          marking: True
          clearing: False
          obstacle_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide corners: wall cost reaches 1 m and fades slowly, so in a 2 m
        # corridor the centre is the cheapest line and the planned path swings
        # wide round corners instead of cutting the inside one (spec section 8).
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # Set at launch to the start floor; switched by the localization manager.
    yaml_filename: ""
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: true         # plan on 10 cm cells: the global costmap is the whole building
      downsampling_factor: 2
      tolerance: 0.5
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"   # forwards and backwards: three-point turns
      angle_quantization_bins: 72
      minimum_turning_radius: 1.0      # m: wheelbase / tan(max_steer) is 0.84; the margin keeps paths drivable
      reverse_penalty: 4.0             # back up only when it saves a lot: the student walks behind
      change_penalty: 0.5
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      debug_visualizations: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.52
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
